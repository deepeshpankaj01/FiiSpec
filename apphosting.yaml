# Firebase App Hosting configuration for the FiiSpec Next.js web app.
# Docs: https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Firebase web config (public identifiers). Replace with your project's values.
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: your-firebase-project-id
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: your-web-api-key
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: your-firebase-project-id.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: your-firebase-project-id.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: your-web-app-id
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FUNCTIONS_REGION
    value: asia-south1
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_USE_EMULATORS
    value: "false"
    availability: [BUILD, RUNTIME]
  # App Check (reCAPTCHA Enterprise site key — public)
  - variable: NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY
    value: your-recaptcha-enterprise-site-key
    availability: [BUILD, RUNTIME]
